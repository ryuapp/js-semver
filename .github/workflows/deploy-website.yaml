# This workflow is managed by gh actions-lock.

name: Deploy Website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            crates.io:443
            deno.com:443
            dl.deno.land:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: wasm32-unknown-unknown
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Build website
        working-directory: website
        run: deno task build
        env:
          VITE_COMMIT_HASH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
