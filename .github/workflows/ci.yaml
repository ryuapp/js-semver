# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - nightly
          - "1.85"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test
      - run: cargo test -p js-semver --no-default-features
      - run: cargo test -p js-semver --features serde
      - run: cargo test -p js-semver --no-default-features --features serde

  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: nightly
          components: miri
          build-warnings: warn
      - run: cargo miri setup
      - run: cargo miri test -p js-semver
      - run: cargo miri test -p js-semver --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: nightly
          components: clippy,rustfmt
      - parallel:
          - name: Check formatting
            run: cargo fmt --check
          - name: Clippy (default features)
            run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            env:
              CARGO_TARGET_DIR: target/clippy-all-features
          - name: Clippy (no default features)
            run: cargo clippy -p js-semver --all-targets --no-default-features -- -D warnings
            env:
              CARGO_TARGET_DIR: target/clippy-no-default-features
          - name: Clippy (serde only)
            run: cargo clippy -p js-semver --all-targets --no-default-features --features serde -- -D warnings
            env:
              CARGO_TARGET_DIR: target/clippy-serde
          - name: Check benches
            run: cargo check --benches
            env:
              CARGO_TARGET_DIR: target/check-benches

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            index.crates.io:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build fuzz image
        uses: docker/build-push-action@v7.4.0
        with:
          context: fuzz
          platforms: linux/amd64
          tags: js-semver-fuzz
          load: true
          cache-from: type=gha,scope=fuzz
          cache-to: type=gha,mode=max,scope=fuzz
      - name: Fuzz ranges
        run: docker run --rm --platform linux/amd64 --volume "$PWD:/workspace" js-semver-fuzz fuzz run --target x86_64-unknown-linux-gnu range -- -max_total_time=30 -max_len=65536 -timeout=2
      - name: Fuzz versions
        run: docker run --rm --platform linux/amd64 --volume "$PWD:/workspace" js-semver-fuzz fuzz run --target x86_64-unknown-linux-gnu version -- -max_total_time=30 -max_len=65536 -timeout=2
      - name: Check pathological inputs
        run: docker run --rm --platform linux/amd64 --volume "$PWD:/workspace" js-semver-fuzz fuzz run --target x86_64-unknown-linux-gnu pathological -- -runs=1 -timeout=10

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            cli.codecov.io:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: llvm-tools-preview
      - name: Generate coverage report
        run: cargo run -p coverage-script --locked
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            crates.io:443
            deno.com:443
            dl.deno.land:443
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            registry.npmjs.org:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            jsr.io:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: wasm32-unknown-unknown
      - uses: jdx/mise-action@v5.0.0

      - run: deno task wasm:build
        working-directory: website
      - run: deno fmt --check
        working-directory: website
      - run: deno lint
        working-directory: website
      - run: deno task test
        working-directory: website
      - run: deno check --unstable-tsgo .
        working-directory: website
      - run: deno task build
        working-directory: website
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}
