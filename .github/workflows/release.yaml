# This workflow is managed by gh actions-lock.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            crates.io:443
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          rustflags: ""
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      - name: Publish to crates.io
        run: cargo publish -p js-semver
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
