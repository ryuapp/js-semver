[package]
name = "js-semver"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Parser and evaluator for npm's flavor of Semantic Versioning, compliant with node-semver"
documentation = "https://docs.rs/js-semver"
license = "MIT-0"
repository = "https://github.com/ryuapp/js-semver"
keywords = ["semver", "nodejs", "npm"]
categories = ["parser-implementations", "data-structures", "no-std"]
include = [
    "/src/**/*",
    "/benches/**/*",
    "/LICENSE",
    "/README.md",
]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { package = "serde_core", version = "^1.0.220", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unreachable_pub = "deny"
unused_qualifications = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"

[lints.clippy]
# Enable all lint groups
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
self_named_module_files = "allow"
implicit_return = "allow"
question_mark_used = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
min_ident_chars = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
shadow_reuse = "allow"
string_slice = "allow"
arithmetic_side_effects = "allow"
indexing_slicing = "allow"
single_call_fn = "allow"

# Panic prevention (deny in production code)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"

exit = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
inline_always = "deny"

[workspace]
members = [".", "fuzz", "scripts/coverage", "website/benchmarks", "website/wasm"]
default-members = [".", "fuzz", "website/benchmarks", "website/wasm"]
resolver = "3"
